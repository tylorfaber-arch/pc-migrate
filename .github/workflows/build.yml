name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

# Two pushes close together would race to publish "latest"; keep only the newest build per branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/PcMigrate.Tests -c Release

      # The build number becomes the fourth part of the version (0.1.0.57) and the release tag,
      # which is how the app's updater tells which build is newer.
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          "version=$v.${{ github.run_number }}" >> $env:GITHUB_OUTPUT
          "tag=v$v.${{ github.run_number }}" >> $env:GITHUB_OUTPUT

      - name: Publish pc-migrate.exe and pcmigrate-cli.exe
        run: |
          dotnet publish src/PcMigrate.App -c Release -o artifacts -p:Version=${{ steps.version.outputs.version }}
          dotnet publish src/PcMigrate.Cli -c Release -o artifacts -p:Version=${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: pc-migrate
          path: |
            artifacts/pc-migrate.exe
            artifacts/pcmigrate-cli.exe

      # Every push to main becomes a release, so the README's
      # releases/latest/download/pc-migrate.exe link always serves the newest build.
      # REQUIRED_VERSION (line 1: the oldest safe version, line 2: why) goes into every release's
      # notes, so copies older than that block jobs until they update.
      - name: Write release notes
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $lines = @(Get-Content REQUIRED_VERSION -ErrorAction SilentlyContinue)
          $body = ""
          if ($lines.Count -ge 1 -and $lines[0].Trim()) {
            $min = $lines[0].Trim(); $why = if ($lines.Count -ge 2) { $lines[1].Trim() } else { "" }
            $body = "<!-- required-version: $min | $why -->`n**Required update for versions older than $min.** $why`n`n"
          }
          Set-Content -Path release-notes.md -Value $body -Encoding utf8NoBOM

      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: pc-migrate ${{ steps.version.outputs.tag }}
          make_latest: true
          generate_release_notes: true
          files: |
            artifacts/pc-migrate.exe
            artifacts/pcmigrate-cli.exe
