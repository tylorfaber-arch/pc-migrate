name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/PcMigrate.Tests -c Release

      - name: Publish pcmigrate.exe
        run: dotnet publish src/PcMigrate.Cli -c Release -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: pcmigrate
          path: artifacts/pcmigrate.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/pcmigrate.exe
