name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/PcMigrate.Tests -c Release

      - name: Publish pcmigrate.exe
        run: dotnet publish src/PcMigrate.Cli -c Release -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: pcmigrate
          path: artifacts/pcmigrate.exe

      # Every push to main becomes a release, so the README's
      # releases/latest/download/pcmigrate.exe link always serves the newest build.
      - name: Read version
        if: github.event_name == 'push'
        id: version
        shell: pwsh
        run: |
          $v = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          "tag=v$v.${{ github.run_number }}" >> $env:GITHUB_OUTPUT

      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: pc-migrate ${{ steps.version.outputs.tag }}
          make_latest: true
          generate_release_notes: true
          files: artifacts/pcmigrate.exe
